# Koyeb App Specification
# Docs: https://www.koyeb.com/docs/reference/app-specification
name: pdf-chat-app
services:
  - name: pdf-chat-app
    type: web
    git:
      repository: github.com/RAKESHKUSHWAHA7518/pdf-chat-app
      branch: main
      buildpack:
        build_command: npm run build
        run_command: npm start
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 3001
        path: /
        protocol: http
    routes:
      - path: /
        port: 3001
    health_checks:
      - http:
          path: /api/health
          port: 3001
    env:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.19.0"
      - key: CORS_ORIGIN
        value: ""
      - key: PUBLIC_URL
        value: ""
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GEMINI_API_KEY
        value: ""
      - key: MONGODB_URI
        value: ""
      - key: JWT_SECRET
        value: ""
