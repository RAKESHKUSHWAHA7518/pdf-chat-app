<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" width="36" height="36">
  <defs>
    <linearGradient id="pdfchat-brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pdfchat-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#0E121E"/>
    </linearGradient>
    <linearGradient id="pdfchat-sparkle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="pdfchat-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#A855F7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container badge with gradient border -->
  <rect x="1.5" y="1.5" width="33" height="33" rx="9" fill="url(#pdfchat-bg-gradient)" stroke="url(#pdfchat-brand-gradient)" stroke-width="1.5"/>

  <!-- PDF Document silhouette -->
  <path d="M10 8.5C10 7.67157 10.6716 7 11.5 7H19.5L25 12.5V26.5C25 27.3284 24.3284 28 23.5 28H11.5C10.6716 28 10 27.3284 10 26.5V8.5Z" fill="url(#pdfchat-brand-gradient)" fill-opacity="0.16" stroke="url(#pdfchat-brand-gradient)" stroke-width="1.3" stroke-linejoin="round"/>
  
  <!-- Folded corner tab -->
  <path d="M19.5 7V12.5H25" stroke="url(#pdfchat-brand-gradient)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Document text lines -->
  <line x1="13.5" y1="16" x2="18.5" y2="16" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13.5" y1="19.5" x2="17.5" y2="19.5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- AI Sparkle / Star burst at bottom right corner of document -->
  <path d="M22 17.5L22.8 19.8L25.1 20.6L22.8 21.4L22 23.7L21.2 21.4L18.9 20.6L21.2 19.8L22 17.5Z" fill="url(#pdfchat-sparkle-gradient)" filter="url(#pdfchat-glow)"/>
  <circle cx="15.5" cy="23.5" r="1.1" fill="#6366F1"/>
</svg>
